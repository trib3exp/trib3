<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TRIB3 OS</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --red:#ff2d55;--dark:#08080f;--surface:#0d0d18;--card:#111120;--border:#1c1c2e;
  --muted:#44445a;--text:#e2e2f0;--sub:#7777a0;
  --font-d:'Syne',sans-serif;--font-m:'DM Mono',monospace;
}
html,body{height:100%;background:var(--dark);color:var(--text);font-family:var(--font-m);overflow:hidden}
/* ── SVG VISUAL SYSTEM ── */
.vis{display:block;width:100%;height:100%}
/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;background:rgba(8,8,15,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.brand{font-family:var(--font-d);font-size:20px;letter-spacing:-1px;color:#fff;cursor:pointer}
.brand b{color:var(--red)}
.share-btn{background:var(--red);border:none;border-radius:20px;padding:6px 14px;color:#fff;font-family:var(--font-m);font-size:9px;font-weight:700;letter-spacing:2px;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7b61ff);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#scroll::-webkit-scrollbar{display:none}
/* ── BOTTOM NAV ── */
.bnav{display:flex;background:var(--surface);border-top:1px solid var(--border);padding:10px 0 max(18px,env(safe-area-inset-bottom));flex-shrink:0;z-index:10}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);cursor:pointer;font-family:var(--font-m);padding:4px 0;transition:color .15s}
.ni.on{color:var(--red)}
.ni-ico{font-size:19px;line-height:1}
.ni-lbl{font-size:7px;letter-spacing:2px;font-weight:700;text-transform:uppercase}
.ni-bar{width:16px;height:2px;background:var(--red);border-radius:1px}
/* ── SCREEN ── */
.scr{padding-bottom:88px;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* ── TYPE ── */
.label{font-size:9px;color:var(--red);letter-spacing:3px;font-weight:700;text-transform:uppercase}
.shead{font-size:9px;color:var(--muted);letter-spacing:3px;font-weight:700;text-transform:uppercase}
.h1{font-family:var(--font-d);font-size:33px;letter-spacing:-2px;line-height:1;color:#fff}
/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.tag{display:inline-block;font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 9px;border-radius:4px;white-space:nowrap}
/* ── BACK BTN ── */
.back{position:absolute;top:14px;left:14px;z-index:5;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* ── BUTTONS ── */
.rbtn{background:var(--red);color:#fff;border:none;border-radius:12px;width:100%;padding:13px;font-family:var(--font-m);font-size:10px;font-weight:700;letter-spacing:2px;cursor:pointer;text-transform:uppercase;transition:opacity .15s}
.rbtn:active{opacity:.8}
.gbtn{background:transparent;border:1px solid var(--border);border-radius:12px;width:100%;padding:11px;font-family:var(--font-m);font-size:9px;font-weight:700;letter-spacing:2px;color:var(--sub);cursor:pointer;text-transform:uppercase}
.pbtn{border-radius:20px;padding:7px 15px;font-family:var(--font-m);font-size:9px;font-weight:700;letter-spacing:2px;cursor:pointer;text-transform:uppercase;border:1px solid;transition:all .15s}
.pbtn:active{transform:scale(.96)}
/* ── TABS ── */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px;background:var(--dark)}
.tab{flex:1;padding:11px 0;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:2px;cursor:pointer;font-family:var(--font-m);text-transform:uppercase;margin-bottom:-1px;transition:color .15s,border-color .15s}
/* ── H-SCROLL ── */
.hs{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
/* ── SHEETS ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;display:flex;align-items:flex-end;backdrop-filter:blur(10px)}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:22px 20px max(32px,env(safe-area-inset-bottom));width:100%;animation:slideUp .25s cubic-bezier(.22,1,.36,1)}
.shandle{width:36px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.inp{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-family:var(--font-m);font-size:13px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--red)}
/* ── PROFILE ── */
.phero{background:linear-gradient(135deg,#1a0820 0%,#0a1525 100%);padding:28px 20px 22px}
.pavlg{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7b61ff);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:28px;color:#fff;margin-bottom:12px;box-shadow:0 0 32px rgba(255,45,85,.35)}
/* ── TOAST ── */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 20px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px;z-index:500;white-space:nowrap;box-shadow:0 8px 32px rgba(255,45,85,.45);pointer-events:none;display:none;animation:fadeIn .2s ease}
/* ── SHARE SCREEN ── */
#share-scr{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(14px)}
.ssheet{background:var(--surface);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:28px 24px 48px;width:100%;max-width:480px;animation:slideUp .28s cubic-bezier(.22,1,.36,1)}
.qr-box{background:#fff;border-radius:16px;padding:16px;width:196px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
/* ── STAT BOXES ── */
.sboxes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.sbox{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center}
.sbox-n{font-family:var(--font-d);font-size:20px;color:#fff}
.sbox-l{font-size:8px;color:var(--muted);letter-spacing:2px;margin-top:2px}
/* ── CONFIRMED ── */
.confirmed{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(0,201,167,.1);border:1px solid rgba(0,201,167,.3);border-radius:12px;padding:14px;color:#00c9a7;font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:16px}
/* ── UPLOAD GRID ── */
.ugrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.uthumb{border-radius:8px;overflow:hidden;aspect-ratio:1;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.uthumb.sel{border-color:var(--red)}
/* ── MEMBER ROW ── */
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
/* ── MEDIA ── */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.mthumb{position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer}
.mpost{border-bottom:1px solid var(--border)}
.mpost-img{height:260px;overflow:hidden}
/* ── COMM PILL ── */
.cpill{flex-shrink:0;width:136px;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--border);cursor:pointer}
.cpill-img{height:72px;overflow:hidden;position:relative}
/* ── ROW HELPERS ── */
.rowhead{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px}
.seeall{font-size:9px;color:var(--red);letter-spacing:1px;background:none;border:none;cursor:pointer;font-family:var(--font-m)}
.evrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:opacity .15s}
.evrow:active{opacity:.8}
/* ── EVENT CARD IMG WRAP ── */
.eimgw{position:relative;height:155px;overflow:hidden}
.eov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.1) 55%)}
</style>
</head>
<body>

<!-- SHARE SCREEN -->
<div id="share-scr">
  <div class="ssheet">
    <div class="shandle"></div>
    <div style="font-family:var(--font-d);font-size:22px;color:#fff;margin-bottom:4px">TRIB3<b style="color:var(--red)">OS</b></div>
    <div style="font-size:10px;color:var(--sub);letter-spacing:2px;margin-bottom:20px">SCAN OR SHARE LINK TO OPEN ON MOBILE</div>
    <div class="qr-box" id="qr-box">
      <svg width="168" height="168" viewBox="0 0 168 168" xmlns="http://www.w3.org/2000/svg">
        <rect width="168" height="168" fill="white"/>
        <text x="84" y="76" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">HOST THIS FILE</text>
        <text x="84" y="94" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">TO GENERATE</text>
        <text x="84" y="112" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff2d55">QR CODE</text>
        <!-- QR corner marks -->
        <rect x="10" y="10" width="30" height="30" fill="none" stroke="#333" stroke-width="4"/>
        <rect x="15" y="15" width="20" height="20" fill="#333"/>
        <rect x="128" y="10" width="30" height="30" fill="none" stroke="#333" stroke-width="4"/>
        <rect x="133" y="15" width="20" height="20" fill="#333"/>
        <rect x="10" y="128" width="30" height="30" fill="none" stroke="#333" stroke-width="4"/>
        <rect x="15" y="133" width="20" height="20" fill="#333"/>
      </svg>
    </div>
    <p style="font-size:10px;color:var(--muted);text-align:center;margin-bottom:16px;line-height:1.6">
      Host this file → paste URL below → live QR updates
    </p>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="url-in" class="inp" placeholder="https://your-site.com/trib3-os.html" style="flex:1;font-size:11px">
      <button onclick="copyUrl()" style="background:var(--red);color:#fff;border:none;border-radius:10px;padding:0 14px;font-family:var(--font-m);font-size:9px;font-weight:700;letter-spacing:2px;cursor:pointer">COPY</button>
    </div>
    <button onclick="dismissShare()" style="width:100%;background:var(--red);color:#fff;border:none;border-radius:12px;padding:13px;font-family:var(--font-d);font-size:15px;font-weight:800;cursor:pointer;letter-spacing:1px">OPEN DEMO →</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="topbar">
    <div class="brand" onclick="navTo('feed')">TRIB3<b>OS</b></div>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="share-btn" onclick="openShare()">⬆ SHARE</button>
      <div class="av">K</div>
    </div>
  </div>
  <div id="scroll"></div>
  <nav class="bnav">
    <button class="ni on" id="ni-feed" onclick="navTo('feed')"><span class="ni-ico">⌂</span><span class="ni-lbl">Feed</span><div class="ni-bar"></div></button>
    <button class="ni" id="ni-events" onclick="navTo('events')"><span class="ni-ico">◈</span><span class="ni-lbl">Events</span></button>
    <button class="ni" id="ni-communities" onclick="navTo('communities')"><span class="ni-ico">◉</span><span class="ni-lbl">Tribes</span></button>
    <button class="ni" id="ni-profile" onclick="navTo('profile')"><span class="ni-ico">◎</span><span class="ni-lbl">Profile</span></button>
  </nav>
</div>
<div id="toast"></div>

<script>
// ─── INLINE SVG VISUALS ────────────────────────────────────────────────────────
// Each returns an SVG string tailored to its subject matter

const VIS = {
  // Community covers (800×400 landscape)
  c1: `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
    <defs>
      <radialGradient id="c1g" cx="30%" cy="60%"><stop offset="0%" stop-color="#ff2d55" stop-opacity=".6"/><stop offset="100%" stop-color="#08080f"/></radialGradient>
      <filter id="c1f"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" result="n"/><feColorMatrix type="saturate" values="0" in="n" result="g"/><feBlend in="SourceGraphic" in2="g" mode="overlay" result="b"/><feComposite in="b" in2="SourceGraphic"/></filter>
    </defs>
    <rect width="800" height="400" fill="#08080f"/>
    <rect width="800" height="400" fill="url(#c1g)"/>
    <!-- Grid lines -->
    ${Array.from({length:16},(_,i)=>`<line x1="${i*54}" y1="0" x2="${i*54}" y2="400" stroke="#ff2d55" stroke-opacity=".07" stroke-width="1"/>`).join('')}
    ${Array.from({length:9},(_,i)=>`<line x1="0" y1="${i*50}" x2="800" y2="${i*50}" stroke="#ff2d55" stroke-opacity=".05" stroke-width="1"/>`).join('')}
    <!-- Circles -->
    <circle cx="160" cy="200" r="120" fill="none" stroke="#ff2d55" stroke-opacity=".15" stroke-width="1"/>
    <circle cx="160" cy="200" r="80" fill="none" stroke="#ff2d55" stroke-opacity=".1" stroke-width="1"/>
    <circle cx="160" cy="200" r="40" fill="#ff2d55" fill-opacity=".08"/>
    <!-- Waveform bars -->
    ${Array.from({length:40},(_,i)=>{const h=20+Math.sin(i*.7)*60+Math.cos(i*.3)*30;return`<rect x="${380+i*11}" y="${200-h/2}" width="7" height="${h}" fill="#ff2d55" fill-opacity="${.15+Math.sin(i*.5)*.1}" rx="2"/>`}).join('')}
    <!-- Dots -->
    ${Array.from({length:12},(_,i)=>`<circle cx="${100+i*55}" cy="${50+Math.sin(i)*20}" r="2" fill="#ff2d55" fill-opacity=".3"/>`).join('')}
    <text x="40" y="380" font-family="monospace" font-size="9" fill="#ff2d55" fill-opacity=".4" letter-spacing="4">TECHNO HEADS LA · 140+ BPM · WAREHOUSE SERIES</text>
  </svg>`,

  c2: `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
    <defs>
      <radialGradient id="c2g" cx="60%" cy="40%"><stop offset="0%" stop-color="#7b61ff" stop-opacity=".5"/><stop offset="100%" stop-color="#08080f"/></radialGradient>
    </defs>
    <rect width="800" height="400" fill="#0a0810"/>
    <rect width="800" height="400" fill="url(#c2g)"/>
    <!-- Vinyl record -->
    <circle cx="200" cy="200" r="170" fill="#111" stroke="#7b61ff" stroke-opacity=".15" stroke-width="1"/>
    <circle cx="200" cy="200" r="150" fill="none" stroke="#7b61ff" stroke-opacity=".08" stroke-width="1"/>
    <circle cx="200" cy="200" r="120" fill="none" stroke="#7b61ff" stroke-opacity=".1" stroke-width="1"/>
    <circle cx="200" cy="200" r="90" fill="none" stroke="#7b61ff" stroke-opacity=".12" stroke-width="1"/>
    <circle cx="200" cy="200" r="60" fill="none" stroke="#7b61ff" stroke-opacity=".15" stroke-width="1"/>
    <circle cx="200" cy="200" r="30" fill="#7b61ff" fill-opacity=".12"/>
    <circle cx="200" cy="200" r="10" fill="#7b61ff" fill-opacity=".4"/>
    <!-- Grooves -->
    ${Array.from({length:8},(_,i)=>`<circle cx="200" cy="200" r="${105+i*6}" fill="none" stroke="#fff" stroke-opacity=".03" stroke-width="1.5"/>`).join('')}
    <!-- Waveform right side -->
    ${Array.from({length:35},(_,i)=>{const h=15+Math.sin(i*.8)*50+Math.cos(i*.4)*25;return`<rect x="${430+i*10}" y="${200-h/2}" width="6" height="${h}" fill="#7b61ff" fill-opacity="${.12+Math.sin(i*.6)*.08}" rx="2"/>`}).join('')}
    <text x="420" y="380" font-family="monospace" font-size="9" fill="#7b61ff" fill-opacity=".4" letter-spacing="4">ANALOG SOUL · VINYL CULTURE · LISTENING SESSIONS</text>
  </svg>`,

  c3: `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
    <defs>
      <radialGradient id="c3g" cx="40%" cy="50%"><stop offset="0%" stop-color="#f5a623" stop-opacity=".45"/><stop offset="100%" stop-color="#0a0806"/></radialGradient>
    </defs>
    <rect width="800" height="400" fill="#0c0a06"/>
    <rect width="800" height="400" fill="url(#c3g)"/>
    <!-- Pottery wheel shape -->
    <ellipse cx="220" cy="210" rx="130" ry="30" fill="#f5a623" fill-opacity=".06" stroke="#f5a623" stroke-opacity=".12" stroke-width="1"/>
    <ellipse cx="220" cy="210" rx="90" ry="20" fill="none" stroke="#f5a623" stroke-opacity=".1" stroke-width="1"/>
    <ellipse cx="220" cy="210" rx="50" ry="12" fill="none" stroke="#f5a623" stroke-opacity=".14" stroke-width="1"/>
    <!-- Vessel silhouette -->
    <path d="M 180 210 Q 150 140 170 80 Q 220 60 270 80 Q 290 140 260 210 Z" fill="#f5a623" fill-opacity=".08" stroke="#f5a623" stroke-opacity=".15" stroke-width="1.5"/>
    <!-- Texture lines -->
    ${Array.from({length:8},(_,i)=>`<path d="M ${170+i*3} ${210-i*16} Q ${220} ${210-i*17} ${270-i*3} ${210-i*16}" fill="none" stroke="#f5a623" stroke-opacity=".06" stroke-width="1"/>`).join('')}
    <!-- Right side organic shapes -->
    <circle cx="580" cy="150" r="80" fill="#f5a623" fill-opacity=".04" stroke="#f5a623" stroke-opacity=".06" stroke-width="1"/>
    <circle cx="620" cy="270" r="50" fill="#f5a623" fill-opacity=".06" stroke="#f5a623" stroke-opacity=".08" stroke-width="1"/>
    <text x="400" y="380" font-family="monospace" font-size="9" fill="#f5a623" fill-opacity=".4" letter-spacing="4">MUD &amp; CLAY · ECHO PARK · KILN ACCESS · STUDIO NIGHTS</text>
  </svg>`,

  c4: `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
    <defs>
      <radialGradient id="c4g" cx="70%" cy="30%"><stop offset="0%" stop-color="#00c9a7" stop-opacity=".4"/><stop offset="100%" stop-color="#050d0b"/></radialGradient>
    </defs>
    <rect width="800" height="400" fill="#050d0b"/>
    <rect width="800" height="400" fill="url(#c4g)"/>
    <!-- Abstract brush strokes -->
    <rect x="60" y="80" width="180" height="240" fill="#00c9a7" fill-opacity=".06" rx="2"/>
    <rect x="80" y="60" width="140" height="280" fill="none" stroke="#00c9a7" stroke-opacity=".1" stroke-width="1"/>
    <!-- Paint splatters / geometric -->
    ${[{x:120,y:150,r:40},{x:180,y:200,r:25},{x:140,y:260,r:30},{x:95,y:220,r:18}].map(c=>`<circle cx="${c.x}" cy="${c.y}" r="${c.r}" fill="#00c9a7" fill-opacity=".07" stroke="#00c9a7" stroke-opacity=".1" stroke-width="1"/>`).join('')}
    <!-- Color swatches right side -->
    ${['#ff2d55','#7b61ff','#f5a623','#00c9a7','#e8b86d'].map((col,i)=>`<rect x="${450+i*60}" y="80" width="45" height="240" fill="${col}" fill-opacity=".08" rx="4"/><rect x="${450+i*60}" y="${80+i*30}" width="45" height="30" fill="${col}" fill-opacity=".15" rx="2"/>`).join('')}
    <text x="40" y="380" font-family="monospace" font-size="9" fill="#00c9a7" fill-opacity=".4" letter-spacing="4">ABSTRACT STUDIO · CHINATOWN · PAINTERS · PRINTMAKERS</text>
  </svg>`,

  c5: `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
    <defs>
      <radialGradient id="c5g" cx="50%" cy="50%"><stop offset="0%" stop-color="#e8b86d" stop-opacity=".25"/><stop offset="100%" stop-color="#050403"/></radialGradient>
    </defs>
    <rect width="800" height="400" fill="#050403"/>
    <rect width="800" height="400" fill="url(#c5g)"/>
    <!-- Film strip -->
    <rect x="40" y="100" width="120" height="200" fill="none" stroke="#e8b86d" stroke-opacity=".2" stroke-width="1.5"/>
    ${Array.from({length:5},(_,i)=>`
      <rect x="50" y="${110+i*38}" width="100" height="28" fill="#e8b86d" fill-opacity=".06" rx="1"/>
      <rect x="43" y="${112+i*38}" width="10" height="8" fill="#e8b86d" fill-opacity=".2" rx="1"/>
      <rect x="43" y="${124+i*38}" width="10" height="8" fill="#e8b86d" fill-opacity=".2" rx="1"/>
      <rect x="147" y="${112+i*38}" width="10" height="8" fill="#e8b86d" fill-opacity=".2" rx="1"/>
      <rect x="147" y="${124+i*38}" width="10" height="8" fill="#e8b86d" fill-opacity=".2" rx="1"/>
    `).join('')}
    <!-- Projector beam -->
    <path d="M 400 0 L 250 400 L 550 400 Z" fill="#e8b86d" fill-opacity=".04"/>

// ─── ROUTING ──────────────────────────────────────────────────────────────────
function navTo(page,id=null,push=true){
  if(push) navHistory.push({...route});
  route={page,id};
  document.querySelectorAll('.ni').forEach(b=>{b.classList.remove('on');b.querySelector('.ni-bar')?.remove()});
  const map={feed:'ni-feed',events:'ni-events',event:'ni-events',communities:'ni-communities',community:'ni-communities',profile:'ni-profile'};
  const nb = document.getElementById(map[page]);
  if(nb){nb.classList.add('on');if(!nb.querySelector('.ni-bar')){const d=document.createElement('div');d.className='ni-bar';nb.appendChild(d)}}
  render();
  document.getElementById('scroll').scrollTop=0;
}
function goBack(){const p=navHistory.pop();if(p)navTo(p.page,p.id,false);else navTo('feed',null,false)}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const s=document.getElementById('scroll');
  const {page,id}=route;
  if(page==='feed') s.innerHTML=renderFeed();
  else if(page==='events') s.innerHTML=renderEvents();
  else if(page==='event') s.innerHTML=renderEvent(id);
  else if(page==='communities') s.innerHTML=renderCommunities();
  else if(page==='community') s.innerHTML=renderCommunity(id);
  else if(page==='profile') s.innerHTML=renderProfile();
}

      ${[{id:'all',name:'ALL',color:'var(--red)'},...COMMUNITIES.map(c=>({id:c.id,name:c.name.split(' ')[0],color:c.color}))].map(f=>{
        const a=evFilter===f.id;
        return`<button class="pbtn" onclick="evFilter='${f.id}';render()" style="flex-shrink:0;color:${a?f.color:'var(--muted)'};border-color:${a?f.color:'var(--border)'};background:${a?f.color+'22':'transparent'}">${f.name}</button>`;
      }).join('')}
    </div>
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px">
      ${evs.map(ev=>{
        const c=gc(ev.cid);const hasT=tickets.has(ev.id);
        return`<div class="card" style="cursor:pointer" onclick="navTo('event','${ev.id}')">
          <div class="eimgw">${img(ev.id)}
            <div class="eov"></div>
            <div style="position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between">
              <span class="tag" style="background:${c.color}22;color:${c.color};border:1px solid ${c.color}44">${c.name}</span>
              <span class="tag" style="background:${hasT?'rgba(0,201,167,.15)':'rgba(255,45,85,.15)'};color:${hasT?'#00c9a7':'var(--red)'};border:1px solid ${hasT?'rgba(0,201,167,.3)':'rgba(255,45,85,.3)'}">${hasT?'✓ GOING':price(ev.price)}</span>
            </div>
            <div style="position:absolute;bottom:0;left:0;right:0;padding:12px 14px">
              <div style="font-family:var(--font-d);font-size:17px;letter-spacing:-.4px;color:#fff;line-height:1.1;margin-bottom:4px">${ev.title}</div>
              <div style="font-size:10px;color:rgba(255,255,255,.5)">${ev.date} · ${ev.loc}</div>

          <div style="padding:10px 14px;display:flex;justify-content:space-between">
            <span style="font-size:11px;color:var(--sub)">${ev.going} attending</span>

          </div>

}

    <div style="position:relative;height:260px;overflow:hidden">

              <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">

// ─── PROFILE ─────────────────────────────────────────────────────────────────
function renderProfile(){
  const myT=EVENTS.filter(e=>tickets.has(e.id));

      ?`<div style="padding:16px;display:flex;flex-direction:column;gap:10px">${myT.map(ev=>`
          <div class="evrow" onclick="navTo('event','${ev.id}')">

            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:700;color:var(--text)">${ev.title}</div>
              <div style="font-size:10px;color:var(--muted);margin-top:2px">${ev.date}</div>
              <div style="font-size:10px;color:var(--muted)">${ev.loc}</div>
            </div>
            <span class="tag" style="background:rgba(0,201,167,.1);color:#00c9a7;border:1px solid rgba(0,201,167,.25);align-self:flex-start">CONFIRMED</span>

      :`<div style="text-align:center;padding:48px 0;font-size:12px;color:var(--muted)">No tickets yet. <span style="color:var(--red);cursor:pointer" onclick="navTo('events')">Browse events →</span></div>`;
  } else if(profileTab==='communities'){
    content=myC.length

          <div class="evrow" onclick="navTo('community','${c.id}')">
            <div style="width:40px;height:40px;border-radius:10px;background:${c.color}22;border:1px solid ${c.color}44;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:16px;color:${c.color};flex-shrink:0">${c.name[0]}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.name}</div>
              <div style="font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px">${c.tag}</div>
            </div>
            <span style="font-size:8px;color:var(--muted);letter-spacing:2px">MEMBER</span>
          </div>`).join('')}</div>`
      :`<div style="text-align:center;padding:48px 0;font-size:12px;color:var(--muted)">No communities joined yet.</div>`;
  } else {
    content=myM.length
      ?`<div class="mgrid" style="padding:0 3px">${myM.map(m=>`<div class="mthumb">${img(m.id)}</div>`).join('')}</div>`
      :`<div style="text-align:center;padding:48px 0;font-size:12px;color:var(--muted)">No media posted yet.</div>`;
  }
  return`<div class="scr">
    <div class="phero">
      <div class="pavlg">K</div>
      <div style="font-family:var(--font-d);font-size:22px;color:#fff;letter-spacing:-.5px">KAELEN V</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px">@kaelen_v</div>
      <div style="display:flex;gap:6px;margin-top:8px">

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function doJoin(id){
  const was=joined.has(id);
  joined.has(id)?joined.delete(id):joined.add(id);
  showToast(was?`Left ${gc(id).name}`:`Joined ${gc(id).name}! 🎉`);
  render();
}

function handleRSVP(evId){
  const ev=ge(evId);
  if(ev.price===0){tickets.add(evId);showToast("You're going! 🎉");render();return;}
  openCheckoutSheet(evId);
}

function openCheckoutSheet(evId){
  const ev=ge(evId);
  const el=document.createElement('div');
  el.className='overlay';el.id='checkout-overlay';
  el.innerHTML=`<div class="sheet">
    <div class="shandle"></div>
    <div style="font-family:var(--font-d);font-size:18px;color:#fff;margin-bottom:14px">CHECKOUT</div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text)">${ev.title}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:3px">${ev.date}</div>
      <div style="font-family:var(--font-d);font-size:20px;color:var(--red);margin-top:6px">${price(ev.price)}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">
      <input class="inp" placeholder="Card number" maxlength="19">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <input class="inp" placeholder="MM/YY" maxlength="5">
        <input class="inp" placeholder="CVC" maxlength="3">
      </div>
    </div>
    <button class="rbtn" id="pay-btn" onclick="processPayment('${evId}')">PAY ${price(ev.price)}</button>
    <button class="gbtn" style="margin-top:8px" onclick="document.getElementById('checkout-overlay').remove()">CANCEL</button>
  </div>`;
  document.body.appendChild(el);
}

function processPayment(evId){
  const btn=document.getElementById('pay-btn');
  btn.textContent='PROCESSING...';btn.style.opacity='.6';
  setTimeout(()=>{
    document.getElementById('checkout-overlay')?.remove();
    tickets.add(evId);showToast('Ticket confirmed! 🎟️');render();
  },1500);
}

function openUploadSheet(cid){
  const c=gc(cid);
  const keys=['u1','u2','u3','u4','u5','u6'];
  const el=document.createElement('div');
  el.className='overlay';el.id='upload-overlay';
  el.innerHTML=`<div class="sheet">
    <div class="shandle"></div>
    <div style="font-family:var(--font-d);font-size:16px;color:#fff;margin-bottom:14px">POST TO ${c.name}</div>
    <div class="shead" style="margin-bottom:8px">CHOOSE PHOTO</div>
    <div class="ugrid" id="ugrid" style="margin-bottom:14px">
      ${keys.map(k=>`<div class="uthumb" id="ut-${k}" onclick="selectUploadThumb('${k}','${c.color}')"><img src="${IMG[k]}" style="width:100%;height:100%;object-fit:cover" alt=""></div>`).join('')}
    </div>
    <textarea class="inp" id="upload-cap" placeholder="Add a caption..." style="resize:none;min-height:60px;margin-bottom:12px"></textarea>
    <button class="rbtn" id="post-btn" onclick="submitUpload('${cid}')" style="opacity:.4" disabled>POST</button>
    <button class="gbtn" style="margin-top:8px" onclick="document.getElementById('upload-overlay').remove()">CANCEL</button>
  </div>`;
  document.body.appendChild(el);
  selectedUpload=null;
}

function selectUploadThumb(key,color){
  selectedUpload=key;
  document.querySelectorAll('.uthumb').forEach(el=>el.classList.remove('sel'));
  document.getElementById('ut-'+key)?.classList.add('sel');
  const btn=document.getElementById('post-btn');
  btn.removeAttribute('disabled');btn.style.opacity='1';
}

function submitUpload(cid){
  if(!selectedUpload)return;
  const btn=document.getElementById('post-btn');
  btn.textContent='POSTING...';btn.style.opacity='.6';
  setTimeout(()=>{
    const cap=document.getElementById('upload-cap')?.value||'New post from the studio.';
    mediaList.unshift({id:selectedUpload,cid,eid:null,caption:cap,author:'kaelen_v',time:'just now'});
    document.getElementById('upload-overlay')?.remove();
    showToast('Media posted! 📸');render();
  },900);
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display='none',2600);
}

// ─── SHARE ────────────────────────────────────────────────────────────────────
function openShare(){ document.getElementById('share-scr').style.display='flex'; }
function dismissShare(){
  document.getElementById('share-scr').style.display='none';
  document.getElementById('app').style.display='flex';
  commTab='feed';profileTab='tickets';evFilter='all';
  render();
}
function copyUrl(){
  const val=document.getElementById('url-in').value||window.location.href;
  navigator.clipboard?.writeText(val).catch(()=>{});
  showToast('URL copied! 📋');
}
document.getElementById('url-in').addEventListener('input',function(){
  if(this.value.length>10){
    const qb=document.getElementById('qr-box');
    qb.innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=168x168&data=${encodeURIComponent(this.value)}&bgcolor=ffffff&color=08080f&margin=4" style="width:168px;height:168px">`;
  }
});
</script>
